
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metas - Foco+</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div id="menu-container"></div>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h2>Minhas Metas 🎯</h2>
                <p>Defina objetivos para seus estudos.</p>
            </div>
        </header>

        <section class="panel">

            <div class="panel-header">
                <h2>Metas</h2>

                <button type="button" id="btnAdicionarMeta">
                    + Adicionar meta
                </button>
            </div>

            <div id="listaMetas">
                <div class="empty">
                    <p>Você ainda não possui metas.</p>
                    <span>Crie uma meta para começar.</span>
                </div>
            </div>

        </section>

    </main>

    <!-- JANELA DE CRIAÇÃO DE META -->
    <div class="metas-modal-overlay" id="modalMeta">

        <div class="metas-modal">

            <button type="button" class="metas-fechar" id="fecharModalMeta">
                &times;
            </button>

            <h2>🎯 Criar nova meta</h2>
            <p>Defina um objetivo para seus estudos.</p>

            <form id="formMeta">

                <label for="tituloMeta">Nome da meta</label>
                <input
                    type="text"
                    id="tituloMeta"
                    placeholder="Ex.: Estudar matemática"
                    required
                    maxlength="100"
                >

                <label for="descricaoMeta">Descrição</label>
                <textarea
                    id="descricaoMeta"
                    placeholder="Descreva seu objetivo..."
                    rows="3"
                ></textarea>

                <label for="prazoMeta">Prazo para concluir</label>
                <input type="date" id="prazoMeta">

                <button type="submit" class="metas-salvar">
                    Salvar meta
                </button>

            </form>

        </div>

    </div>

    <script src="../js/menu.js" defer></script>
    <script src="../js/metas.js" defer></script>

</body>
</html>
