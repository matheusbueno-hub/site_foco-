
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarefas - Foco+</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- MENU COMPARTILHADO -->
    <div id="menu-container"></div>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

        <!-- CABEÇALHO -->
        <header class="topbar">

            <div>

                <h2>
                    Minhas Tarefas 📝
                </h2>

                <p>
                    Veja e organize todas as suas tarefas.
                </p>

            </div>

        </header>


        <!-- PAINEL DE TAREFAS -->
        <section class="panel">

            <div class="panel-header">

                <div>

                    <h2>Tarefas</h2>

                    <p>
                        Adicione provas, trabalhos e atividades.
                    </p>

                </div>

                <button id="btnAdicionar">
                    + Adicionar
                </button>

            </div>


            <!-- LISTA DE TAREFAS -->
            <div id="taskList" class="task-list">

                <div class="empty">

                    <p>
                        Você ainda não possui tarefas.
                    </p>

                    <span>
                        Adicione uma tarefa para começar.
                    </span>

                </div>

            </div>

        </section>

    </main>


    <!-- MODAL PARA ADICIONAR TAREFA -->
    <div id="modalTarefa" class="modal">

        <div class="modal-content">

            <!-- CABEÇALHO DO MODAL -->
            <div class="modal-header">

                <h2>
                    Nova tarefa
                </h2>

                <button
                    id="fecharTarefa"
                    type="button"
                >
                    ✕
                </button>

            </div>


            <!-- FORMULÁRIO -->
            <form id="formTarefa">

                <label for="nomeTarefa">
                    Nome da tarefa
                </label>

                <input
                    type="text"
                    id="nomeTarefa"
                    placeholder="Ex: Trabalho de Matemática"
                    required
                >


                <label for="materiaTarefa">
                    Matéria
                </label>

                <input
                    type="text"
                    id="materiaTarefa"
                    placeholder="Ex: Matemática"
                    required
                >


                <label for="dataTarefa">
                    Data de entrega
                </label>

                <input
                    type="date"
                    id="dataTarefa"
                    required
                >


                <label for="prioridadeTarefa">
                    Prioridade
                </label>

                <select
                    id="prioridadeTarefa"
                    required
                >

                    <option value="">
                        Escolha a prioridade
                    </option>

                    <option value="Baixa">
                        🟢 Baixa
                    </option>

                    <option value="Média">
                        🟡 Média
                    </option>

                    <option value="Alta">
                        🔴 Alta
                    </option>

                </select>


                <button
                    type="submit"
                    class="btn-salvar"
                >
                    Salvar tarefa
                </button>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="../js/menu.js" defer></script>
    <script src="../js/tarefas.js"></script>

</body>

</html>
