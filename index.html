
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Foco+</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- LOGIN -->
    <script src="./js/login.js" defer></script>
</head>

<body>

    <main class="login-container">

        <!-- LADO DA MARCA -->
        <section class="brand-section">

            <div class="brand-content">

                <img
                    src="./logo-site.png"
                    alt="Logo Foco+"
                    class="logo"
                >

                <h1>Seu futuro começa aqui!</h1>

                <p>
                    Organize sua rotina, planeje seus estudos
                    e alcance seus objetivos.
                </p>

                <div class="brand-decoration">
                    <span>ORGANIZE</span>
                    <span>•</span>
                    <span>PLANEJE</span>
                    <span>•</span>
                    <span>EVOLUA</span>
                </div>

            </div>

        </section>

        <!-- LADO DO LOGIN -->
        <section class="form-section">

            <div class="login-card">

                <div class="welcome-text">

                    <span class="welcome-label">
                        BEM-VINDO DE VOLTA
                    </span>

                    <h2>Faça seu login</h2>

                    <p>
                        Entre na sua conta e continue sua jornada.
                    </p>

                </div>

                <!-- FORMULÁRIO -->
                <form id="loginForm">

                    <div class="input-group">

                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="input-group">

                        <label for="password">Senha</label>

                        <div class="password-container">

                            <input
                                type="password"
                                id="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                            >
                                Mostrar
                            </button>

                        </div>

                    </div>

                    <div class="form-options">

                        <label class="remember-option">

                            <input type="checkbox" id="remember">

                            Lembrar de mim

                        </label>

                        <a href="#" id="forgotPassword">
                            Esqueceu a senha?
                        </a>

                    </div>

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span>Entrar na minha conta</span>

                        <span class="button-arrow">→</span>

                    </button>

                    <p
                        id="loginMessage"
                        class="login-message"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>

                <!-- CADASTRO -->
                <div class="register-section">

                    <p>
                        Ainda não tem uma conta?

                        <a href="./paginas/cadastro.html">
                            Criar conta
                        </a>
                    </p>

                </div>

                <!-- RODAPÉ -->
                <div class="login-footer">

                    <span>FOCO+ © 2026</span>

                    <span>SEU ESTUDO, SEU FUTURO.</span>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
